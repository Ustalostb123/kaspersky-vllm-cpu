name: Проверка запуска
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify.yml'
      - 'Dockerfile*'
      - '*requirements*'
      - 'app/**'
      - 'scripts/**'
      - 'k8s/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Тесты
        run: python3 -m unittest discover -s tests -v
      - name: Сборка
        run: |
          docker build -t llm-cpu:0.27.0 -f Dockerfile .
          docker build -t llm-downloader:0.27.0 -f Dockerfile.downloader .
          docker builder prune -af
      - name: Kubernetes
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind create cluster --wait 180s
          docker save llm-cpu:0.27.0 llm-downloader:0.27.0 | gzip -1 > /tmp/llm-images.tar.gz
          docker image rm llm-cpu:0.27.0 llm-downloader:0.27.0
          gzip -dc /tmp/llm-images.tar.gz | docker exec --privileged -i kind-control-plane ctr --namespace=k8s.io images import --all-platforms --digests --snapshotter=overlayfs -
          rm /tmp/llm-images.tar.gz
          kubectl apply -f k8s/namespace.yaml
          API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$API_TOKEN"
          echo "API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"
          kubectl -n llm-cpu create secret generic inference-secrets --from-literal=hf-token= --from-literal="api-token=$API_TOKEN"
          kubectl apply -k k8s
          kubectl -n llm-cpu set resources deployment/inference -c server --requests=cpu=1,memory=3Gi --limits=cpu=2,memory=5Gi
          kubectl -n llm-cpu rollout status deployment/inference --timeout=15m
      - name: Запрос к модели
        run: |
          kubectl -n llm-cpu port-forward service/inference 8000:8000 > /tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          python3 scripts/check_endpoint.py
      - name: Повторный запуск без Hugging Face
        run: |
          kubectl -n llm-cpu patch deployment inference --type=json -p '[{"op":"add","path":"/spec/template/spec/initContainers/0/env/-","value":{"name":"HF_HUB_OFFLINE","value":"1"}},{"op":"add","path":"/spec/template/spec/initContainers/0/env/-","value":{"name":"HF_ENDPOINT","value":"http://127.0.0.1:9"}}]'
          kubectl -n llm-cpu rollout status deployment/inference --timeout=15m
          kubectl -n llm-cpu logs deployment/inference -c download-model | grep model_cache_hit
          kubectl -n llm-cpu port-forward service/inference 8000:8000 > /tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          python3 scripts/check_endpoint.py
          python3 scripts/benchmark.py --requests 4 --concurrency 1 | tee /tmp/benchmark.md
          cat /tmp/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Диагностика
        if: failure()
        run: |
          kubectl -n llm-cpu get pods -o wide || true
          kubectl -n llm-cpu get events --sort-by=.lastTimestamp || true
          kubectl -n llm-cpu logs deployment/inference -c server --tail=80 || true
          kubectl -n llm-cpu logs deployment/inference -c download-model --tail=30 || true
