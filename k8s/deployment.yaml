apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-model
          image: llm-downloader:0.27.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-env
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: hf-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: '250m', memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: model-cache, mountPath: /models}
            - {name: temp, mountPath: /tmp}
            - {name: home-cache, mountPath: /home/app/.cache}
      containers:
        - name: server
          image: llm-cpu:0.27.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-env
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: api-token
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: '2', memory: 4Gi}
            limits: {cpu: '4', memory: 6Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - {name: model-cache, mountPath: /models, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: temp, mountPath: /tmp}
            - {name: home-cache, mountPath: /home/app/.cache}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: model-cache}
        - name: config
          configMap: {name: server-config}
        - name: temp
          emptyDir: {}
        - name: home-cache
          emptyDir: {}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
