apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-cpu
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: inference-env
    envs:
      - config/model.env
  - name: server-config
    files:
      - config/serve.json
      - config/logging.json
